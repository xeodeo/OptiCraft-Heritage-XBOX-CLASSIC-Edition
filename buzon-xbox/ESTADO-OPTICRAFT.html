<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estado OptiCraft Xbox</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
body{margin:0}
/* Layout: a console "dashboard" — version switch on top, one progress strip per version, then the task list grouped by state. */
:root{
  --bg:#f3f5f1; --panel:#ffffff; --ink:#18201a; --muted:#5d685f; --line:#dde3da;
  --accent:#0f7b2e; --accent-soft:#e2f1e5;
  --ok:#1b8a3c; --test:#2f6fd6; --wip:#c78400; --todo:#8a948c; --bad:#c7392f; --park:#a99b7a;
  --ok-bg:#e3f3e7; --test-bg:#e4ecfb; --wip-bg:#fbf0d9; --todo-bg:#eceeea; --bad-bg:#fbe4e2; --park-bg:#f1ecdf;
  --display:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;
  --body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101511; --panel:#171e18; --ink:#e7ede6; --muted:#9aa79c; --line:#2a342c;
  --accent:#4cc46a; --accent-soft:#1c2e20;
  --ok:#4cc46a; --test:#6e9ff0; --wip:#e2a93a; --todo:#7d887f; --bad:#ec6a5f; --park:#b9a983;
  --ok-bg:#1a2f1f; --test-bg:#1a2438; --wip-bg:#33280f; --todo-bg:#202721; --bad-bg:#3a1c1a; --park-bg:#2c271b;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101511; --panel:#171e18; --ink:#e7ede6; --muted:#9aa79c; --line:#2a342c;
  --accent:#4cc46a; --accent-soft:#1c2e20;
  --ok:#4cc46a; --test:#6e9ff0; --wip:#e2a93a; --todo:#7d887f; --bad:#ec6a5f; --park:#b9a983;
  --ok-bg:#1a2f1f; --test-bg:#1a2438; --wip-bg:#33280f; --todo-bg:#202721; --bad-bg:#3a1c1a; --park-bg:#2c271b;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,4vw,36px);line-height:1.1;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:4px 0 0;max-width:62ch}
.stamp{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:right}
.stamp b{color:var(--ink);font-weight:500}
.note{background:var(--accent-soft);border-radius:10px;padding:12px 16px;font-size:14.5px;display:none}
.note.show{display:block}
.versions{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.ver{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.ver[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ver:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ver h2{font-family:var(--display);font-size:20px;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ver h2 small{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--muted)}
.pct{font-family:var(--display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.pct em{font-style:normal;font-size:14px;color:var(--muted);font-family:var(--body);font-weight:500;margin-left:6px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--todo-bg)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--c);vertical-align:0}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters label{font-size:13px;color:var(--muted);margin-right:4px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 12px;font:500 13px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.groups{display:flex;flex-direction:column;gap:22px}
.group h3{font-family:var(--display);font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:8px;letter-spacing:.02em;text-transform:uppercase}
.group h3 .dot{width:10px;height:10px;border-radius:3px;background:var(--c)}
.group h3 .n{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-transform:none}
.list{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:11px 16px;border-top:1px solid var(--line);align-items:start}
.row:first-child{border-top:0}
.row .stripe{width:4px;align-self:stretch;border-radius:2px;background:var(--c)}
.row .main{min-width:0}
.row .name{font-weight:600}
.row .desc{color:var(--muted);font-size:13.5px;margin-top:1px}
.row .meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-family:var(--mono);font-size:11.5px;padding:2px 7px;border-radius:5px;background:var(--todo-bg);color:var(--muted);white-space:nowrap}
.tag.v{background:var(--accent-soft);color:var(--accent)}
.empty{padding:28px 20px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:12px}
[data-s="probado"]{--c:var(--ok)} [data-s="por_probar"]{--c:var(--test)} [data-s="en_marcha"]{--c:var(--wip)}
[data-s="falta"]{--c:var(--todo)} [data-s="fallo"]{--c:var(--bad)} [data-s="aparcado"]{--c:var(--park)}
@media (max-width:560px){.row{grid-template-columns:auto 1fr}.row .meta{grid-column:2;justify-content:flex-start}.stamp{text-align:left}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}
.vertit{font-size:1.4rem;margin:0 0 12px}
</style>

</head>

ef": "91", "orden": 2, "id": "152-vagonetas-tnt"}, {"version": "1.5.2", "estado": "falta", "area": "Wither", "nombre": "Wither con menos tirones", "nota": "Limitar búsquedas de camino, luz de la explosión una vez.", "ref": "83", "orden": 48, "id": "152-wither-tirones"}, {"version": "1.5.2", "estado": "probado", "area": "1.5.2", "nombre": "Yunque: coste de XP con número", "nota": "Del plan 69.", "ref": "", "orden": 44, "id": "152-yunque-xp"}, {"version": "ambas", "estado": "por_probar", "area": "Controles", "nombre": "Volando o montado, agacharse siempre es mantener (aunque esté en alternar)", "nota": "Antes con «alternar» volando bajabas hasta el suelo (189b801 / 0944064). Usuario 26-11 (1.5.2): bien.", "ref": "118", "orden": 7, "estado_125": "probado", "estado_152": "probado", "id": "agacharse-vuelo"}, {"version": "ambas", "estado": "probado", "area": "Mando", "nombre": "Agacharse con interruptor", "nota": "Confirmado 20-11.", "ref": "84", "orden": 16, "id": "agacharse"}, {"version": "ambas", "estado": "falta", "area": "Futuro", "nombre": "Ponernos a la altura de la 3DS/NuMC3DS (~1.10): 1.6.4 + lógica 1.8-1.12", "nota": "La 1.5.2 ya tiene tolva/comparador/soltador/yunque/faro/pociones. Falta 1.6+: caballos, alfombras, heno, arcilla teñida, cristal tintado, slime, prismarina, observador. Plan: 1.6.4 desde MCP + Cuberite (C++, Apache) + tablas minecraft-data/ViaBackwards. El juego de 3DS es Pocket 0.15.4~1.1.5 (no se puede descompilar como MCP). Buzon 131.", "ref": "131", "orden": 90, "id": "altura-3ds"}, {"version": "ambas", "estado": "en_marcha", "area": "Mods y texturas", "nombre": "Bot de minería automática (elige mineral: baja y mina solo)", "nota": "Pedido 26-11 tras probar el ESP. Referencia: Baritone (código abierto, LGPL-3, github.com/cabaletta/baritone; viene dentro de wwe.jar) — su IMineProcess: buscar el mineral, ir, minar. Para nosotros: módulo del modo admin que use el ESP + pathfinding sencillo (A* por bloques) + minar con el mando. Grande: encargo para agy. 26-11: para 1.2.5, 1.5.2 y la futura 1.6.4. 26-11: encargo 133 a agy (wt-agy-152, rama agy-mineria); agy se quedó sin cuota a mitad (vuelve ~03-12): AdminMiner.cpp empezado sin compilar. Traspaso en buzon 133. 26-11 tarde: Claude terminó y probó el código de agy en xemu contra el server local: en 2 min bajó cavando de y=71 a 53 y sacó 28 menas de hierro, sin morir, memoria estable ~18 MB. Falta: contador mined=0 en server, probar en un jugador, pasarlo a 1.5.2 int y 1.2.5. Sin commit (wt-agy-152). 26-11 tarde: añadido comer solo, pico más barato primero, salir del agua, no ir a menas con lava cerca (compilado, sin subir: el PC se quedó sin memoria). PLAN para poner bloques (tapar lava/agua, puentes/pilares tipo scaffold, ideas de Baritone): buzon 134. 26-11 noche: tapa lava/agua con la roca que va sacando (o tierra/piedra/netherrack de la barra) antes de romper; ya va a menas junto a lava. No gasta herramientas casi rotas. PROBAR en consola: mena con lava al lado (debe poner roca y sacarla), corriente de agua (ya no lo arrastra). Buzon 134. 26-11 noche: el usuario lo probó: mina; arreglado bucle (quieto/tirones), lava (mirar+esperar+LiquidInteract), mena más cercana, inventario lleno falso. Buzon 134.", "ref": "132", "orden": 3, "id": "bot-mineria"}, {"version": "1.6.4", "estado": "aparcado", "area": "Mods y texturas", "nombre": "Hacks de burros: donkey tracer/ESP, dupe de burro y MountBypass", "nota": "Pedido 26-11 (en el SMP confirman que hay burros). Referencias: creepy-salhack (fork de SalHack 1.12.2) exploit/MountBypassModule.java y EntityDesyncModule.java; wwe.jar (cliente WWE 1.12.2, ofuscado y con textos cifrados: toca GuiScreenHorseInventory/AbstractHorse). PROBLEMA: 1.2.5/1.5.2 no tienen caballos ni burros: el traductor tiene que dejarlos ver (entidad) y abrir su inventario con cofre. El tracer es lo más fácil (como el ESP de jugadores). 26-11: el usuario lo deja para la 1.6.4 (que ya trae caballos y burros de serie).", "ref": "132", "orden": 4, "id": "burros-hacks"}, {"version": "ambas", "estado": "por_probar", "area": "Controles", "nombre": "Chat en la flecha (o cualquier botón cambiado) sigue funcionando tras reiniciar", "nota": "La tabla de teclas no se rehacía al cargar options.txt (1.2.5 90faed9, 1.5.2 1e036e1). Además options.txt dejaba de crecer: tenía dolbyDigital 1887 veces (46 KB). Subido.", "ref": "Claude", "orden": 3, "estado_152": "probado", "estado_125": "probado", "id": "chat-boton"}, {"version": "ambas", "estado": "fallo", "area": "Mods y texturas", "nombre": "Chocobo crecido (p. ej. morado del huevo): solo se monta/abre dándole en las patas y desaparece al mirar al cielo", "nota": "Visto por el usuario 26-11 en la 1.5.2. Causa: Entity::setSize no rehace la caja (solo setPosition): al crecer se quedaba la caja de 0,5 del pollito a la altura de las patas; esa caja también decide si se dibuja, por eso desaparece al mirar arriba. ARREGLO (sin commit, 1.5.2 y 1.2.5): setPosition tras cada setSize (crecer, volver a pollito, cargar de NBT). EN LA CONSOLA desde 26-11 ~11:45 (subido, md5 comprobado): PROBAR. Que se pueda montar/abrir dándole en el cuerpo y que no desaparezca al mirar arriba. Usuario 26-11: SIGUE solo en las patas con la build 26-11 11:05 (que ya llevaba setPosition tras setSize). El modelo adulto mide ~2,2 de alto (escala 0,8) y la caja 0,95x1,85, pero eso no explica 'solo patas'. Puesto un log de diagnóstico: cada 5 s «[choco] box ... box Y min..max» de los chocobos a <6 bloques del jugador. Falta que el usuario se acerque a uno y mirar el netlog.", "ref": "113", "orden": 0, "id": "chocobo-caja-crecido"}, {"version": "ambas", "estado": "por_probar", "area": "Mods y texturas", "nombre": "Chocobos: cría con cabeza despegada, no parece chocobo, dorado no vuela, se mueve solo montado, monta sin silla, daño al aterrizar", "nota": "117+119 juntados (1.2.5 e69f816 / 1.5.2 926dca9): ChocoCraft completo como el original: controles, montar, correr, Chocopedia (libro + página de cada chocobo, cambiar dueño), Chocodisfraz, matas de Gysahl solo con el mod activo, bandadas salvajes por bioma, paja/mata con textura propia. Probado en xemu 1.2.5. Para volar: Huevo de Chocobo Morado (creativo/TMI) o criar Blanco×Negro con Gysahl Dorado. Usuario 26-11 (1.2.5): bien. Al crear el mundo con el mod no veía chocobos cerca; andando más sí salen (todo bien). Idea: aviso al activar el mod de que solo salen en terreno nuevo. Usuario 26-11 (1.5.2): bien.", "ref": "117", "orden": 3, "estado_125": "probado", "estado_152": "probado", "id": "chocobos-fallos"}, {"version": "ambas", "estado": "por_probar", "area": "Gráficos", "nombre": "Cofre centrado en la mano, inventario y vagoneta", "nota": "1.2.5: bien; el cofre se ve un poco bajo en vertical (detalle).", "ref": "89", "orden": 13, "estado_125": "probado", "estado_152": "probado", "id": "cofre-mano"}, {"version": "1.5.2", "estado": "probar", "area": "Mods y texturas", "nombre": "Criticals, AutoTool con Forcefield, ESP de burros, lag de 460 ovejas, pestañas del crafteo", "nota": "26-11 noche. Criticals (Combate). AutoTool coge la espada en cada golpe de Forcefield/Aimbot. ESP: burros/mulas/caballos/llamas del server en dorado + modo Burros/caballos. Mobs remotos con física 1/4 ticks en Xbox (granja de 460 ovejas iba a 1-3 fps). Crafteo 2x2: pestañas caben en el panel.", "ref": "134", "orden": 3, "id": "combate-burros-ovejas"}, {"version": "ambas", "estado": "probado", "area": "Mando", "nombre": "Stick con icono y reasignable tras Restablecer", "nota": "Confirmado 20-11.", "ref": "89", "orden": 12, "id": "controles-stick"}, {"version": "1.5.2", "estado": "falta", "area": "Interfaz", "nombre": "Crear mundo → Opciones de juego: B saca al menú principal en vez de volver", "nota": "Usuario 26-11.", "ref": "", "orden": 0, "id": "crear-mundo-b-sale"}, {"version": "ambas", "estado": "por_probar", "area": "Interfaz", "nombre": "Crear mundo: «Opciones de juego» como LCE (fuego, dinamita, PVP, conservar inventario, criaturas, bloques)", "nota": "Interfaz Legacy: fila nueva «Opciones de juego...» al crear mundo. 1.5.2 usa sus GameRules + tntExplodes y pvp (2e8d265); 1.2.5 tiene ahora reglas de juego guardadas igual que 1.5.2 (537dc24). Sin probar. Usuario 26-11 (1.5.2): bien. PERO: al pulsar B en «Opciones de juego» para volver a crear mundo te saca al menú principal (falla).", "ref": "120", "orden": 9, "estado_125": "probado", "estado_152": "probado", "id": "crear-mundo-opciones"}, {"version": "ambas", "estado": "por_probar", "area": "Sonido", "nombre": "Creeper: se oyen la mecha y la explosión", "nota": "Los clips pasaban del tope de 256 KB y se saltaban; ahora 384 KB (1.2.5 9a26a4a, 1.5.2 en 412dce9). Usuario 26-11 (1.5.2): bien.", "ref": "105", "orden": 5, "estado_125": "probado", "estado_152": "probado", "id": "creeper-sonido"}, {"version": "ambas", "estado": "fallo", "area": "Interfaz", "nombre": "Cuelgue en consola 22-11 ~18:00 (sin log: receptor apagado)", "nota": "Reproducir con el receptor encendido.", "ref": "111", "orden": 1, "id": "cuelgue-1822"}, {"version": "ambas", "estado": "por_probar", "area": "Red", "nombre": "Cuelgue al morir en el SMP 1.12.2 (doble cambio de mundo al reaparecer)", "nota": "Arreglado por Claude (1.2.5 6fa1c4b, 1.5.2 59b1481): el jugador viejo quedaba en knownEntities del mundo abandonado y se borraba dos veces. Reproducido y verificado en xemu con servidor de repetición (3 dobles reapareceres). Subido 23-11 ~20:00 ; desde 24-11 también la 1.2.5 exp lo tiene (subida 24-11). Usuario 26-11 (1.2.5): tarda un poco pero no se cuelga. Usuario 26-11 (1.5.2): bien.", "ref": "124", "orden": 0, "estado_125": "probado", "estado_152": "probado", "id": "cuelgue-morir-smp"}, {"version": "ambas", "estado": "por_probar", "area": "Arreglos", "nombre": "Cuelgue al entrar a un mundo tras apagar la Xbox", "nota": "No se repitió con el log escuchando. Si vuelve: avisar con el log encendido.", "ref": "", "orden": 20, "estado_125": "probado", "estado_152": "probado", "id": "cuelgue-m SP de bloques: mineral y bloque juntos (diamante, oro, hierro, lapislázuli, esmeralda, redstone)", "nota": "Pedido 24-11: buscar diamante marca mineral de diamante Y bloque de diamante; igual hierro/oro/lapislázuli/esmeralda; redstone = mineral, mineral encendido y bloque; lava = quieta y fluyendo. espMatches() en AdminModeMod.cpp (sin commit, en wt-build-152 y wt-opti30). En la consola desde 26-11. Usuario 26-11 (1.2.5): «súper bien». Usuario 26-11 (1.5.2): bien.", "ref": "122", "orden": -1, "estado_125": "probado", "estado_152": "probado", "id": "esp-mineral-bloque"}, {"version": "1.5.2", "estado": "por_probar", "area": "Rendimiento", "nombre": "Vagonetas y explosiones más ligeras; no colgarse sin memoria", "nota": "Encargo 91 (también en 1.2.5): colisiones entre vagonetas, explosiones de TNT/creeper y recuperación si se acaba la memoria. Claude añadió que un chunk sin guardar no se descarga aunque falte memoria. Solo aplica a 1.5.2 (usuario 23-11): probar allí.", "ref": "91", "orden": 3, "estado_152": "probado", "id": "explosiones-memoria"}, {"version": "ambas", "estado": "por_probar", "area": "Forks", "nombre": "Traer lo útil del fork ramide1 (arco, cambio de dimensión, multijugador)", "nota": "Hecho y probado en mundo (1.2.5 f1bf66a, 1.5.2 a2ec7d1): arco como Java, listas de dibujo, multijugador, opción «Pistas en pantalla». OJO: al volver sobre chunks guardados la RAM libre bajó a ~11 MB; vigilar. Usuario 26-11 (1.2.5): bien. Usuario 26-11 (1.5.2): bien.", "ref": "98", "orden": 8, "estado_125": "probado", "estado_152": "probado", "id": "fork-ramide1"}, {"version": "1.5.2", "estado": "falta", "area": "Futuro", "nombre": "Después de la 1.5.2: port a 1.6.4 y luego 1.7.10 (techo realista; 1.8+ no cabe)", "nota": "Después de terminar la 1.5.2. La 1.6.4 irá en SU PROPIA carpeta del lanzador (OptiCraft\u0001.6.4), como 1.2.5 y 1.5.2 (usuario 23-11). 1.6.4 ya descompilada (mcp-diff/src164, MCP 8.11 de Forge): 152 clases nuevas y 863 cambiadas (~23 000 líneas): caballo sa el NBT del item al server (convertSlotFromNative descomprime y reenvia), asi que un libro con titulo largo podria crashear container_set_slot -> rollback dupe; falta ver si el traductor reenvia MC|BSign/edit_book (no lo hace de momento) y si 1620 lo tiene parcheado. 24-11: en la consola va el build con el EXPERIMENTO de dupe (botón = coger+cerrar cofre) y logs de diagnóstico \"dupe\" (quitar al cerrar el tema). Usuario 26-11 (1.2.5): bien. Usuario 26-11 (1.5.2): bien.", "ref": "122", "orden": 32, "estado_125": "probado", "estado_152": "probado", "id": "modo-admin"}, {"version": "ambas", "estado": "por_probar", "area": "Red", "nombre": "Buscar packs de Modrinth tarda (la lista va saliendo poco a poco)", "nota": "Usuario 26-11: la DESCARGA del pack va «súper rápida»; lo lento es la lista. Log: por cada pack la consola abre 2 conexiones HTTPS nuevas (versiones del proyecto + icono), 3 hilos, Connection: close, sin caché de DNS ni reanudación TLS; además hubo fallos «sin DNS» a mitad. Hay caché de resultados (.modrinth-<ver>.txt) así que la 2.ª vez va más rápido. Plan: caché de DNS + reanudación de sesión TLS (y quizá keep-alive). Usuario 26-11: la 2.ª búsqueda tarda igual. Causa: la caché guardaba si el pack sirve, pero los ICONOS se bajaban todos otra vez (una conexión HTTPS por pack). ARREGLO (sin commit, ambas): caché de iconos en disco texturepacks\\.icon-<proyecto>.rgba (32x32). Por probar. Pendiente si hace falta: caché de DNS y reanudación TLS. EN LA CONSOLA desde 26-11 ~11:45 (subido, md5 comprobado): PROBAR. La 1.ª búsqueda tarda igual; la 2.ª debería salir casi al momento.", "ref": "116", "orden": 2, "id": "modrinth-lista-lenta"}, {"version": "ambas", "estado": "por_probar", "area": "Interfaz", "nombre": "Descargar packs de Modrinth desde la consola (≈244 para 1.2.5, ≈266 para 1.5.2)", "nota": "Probado 1.2.5: pestaña «Para 1.2.5» lenta (revisaba ~230 packs uno a uno). Arreglado (61c98c7): 3 a la vez, respuestas guardadas en texturepacks\\.modrinth-<ver>.txt (la 2ª vez sale al instante) y «buscando más X/Y» junto a la página. Sin probar.", "ref": "111", "orden": 1, "estado_125": "probado", "id": "modrinth-packs"}, {"version": "ambas", "estado": "por_probar", "area": "Mods y texturas", "nombre": "Apagar un mod no lo apaga (chocobos siguen y sus objetos salen en los menús); detector de mods por mundo", "nota": "Hecho (detector 9f442e3; apagar de verdad 6121e6c / a20d430): con el mod apagado sus criaturas se guardan dormidas en el chunk y reviven al encenderlo; sus objetos no salen en creativo, crafteo ni TooManyItems. Sin probar. Usuario 26-11 (1.5.2): bien.", "ref": "115", "orden": 3, "estado_125": "probado", "estado_152": "probado", "id": "mods-apagado"}, {"version": "ambas", "estado": "probado", "area": "Mods y texturas", "nombre": "ChocoCraft: chocobos salvajes aparecen", "nota": "Visto en el log de la consola 22-11 (Spawned wild Yellow Chocobo).", "ref": "101", "orden": 22, "id": "mods-chocobos-ok"}, {"version": "ambas", "estado": "por_probar", "area": "Mods y texturas", "nombre": "Mod ChocoCraft (chocobos)", "nota": "ChocoCraft con modelo/texturas propias, 6 colores y cría. Encargo 101 juntado (1.2.5 6819d61, 1.5.2 en port152-int bfbfc80) y subido. Todos apagados por defecto: activar en Mods → catálogo. Usuario 26-11 (1.2.5): bien, salen los chocobos y la Gysahl. Usuario 26-11 (1.5.2): bien.", "ref": "101", "orden": 22, "estado_125": "probado", "estado_152": "probado", "id": "mods-chocobos"}, {"version": "ambas", "estado": "por_probar", "area": "Mods y texturas", "nombre": "Mod Herobrine clásico (altar)", "nota": "Probado en 1.2.5 (23-11): quema al jugador; no prende el suelo, igual que el original (iLoveYou solo hace setFireTicks(200) al jugador). Usuario 26-11 (1.5.2): bien.", "ref": "101", "orden": 21, "estado_125": "probado", "estado_152": "probado", "id": "mods-herobrine"}, {"version": "ambas", "estado": "por_probar", "area": "Interfaz", "nombre": "Menú de mods: fondo quieto y contenido muy arriba; revisar todas las pantallas nuevas en 480p/720p", "nota": "Hecho: estilo LCE en catálogo, chocobo, Herobrine, minimapa, waypoints, servidores y buscar skin (informe 112); fondo animado; arreglada la fila de ayudas que no dibujaba con más de 4 botones. Usuario 26-11 (1.5.2): bien.", "ref": "111", "orden": 1, "estado_125": "probado", "estado_152": "probado", "id": "mods-menu-ui"}, {"version": "ambas", "estado": "por_probar", "area": "Mods y texturas", "nombre": "Mods: catálogo con instalar de un clic, minimapa (Rei + Xaero), X-Ray, Village Locator, luces dinámicas (de erluza)", "nota": "Funciona en consola (usuario 22-11). Falla: a veces se redibuja entero (encargo 114). Usuario 26-11 (1.5.2): bien.", "ref": "101", "orden": 20, "estado_125": "probado", "estado_152": "probado", "id": "mods-minimapa"}, {"version": "ambas", "estado": "en_marcha", "area": "Rendimiento", "nombre": "El Nether va con mucho lag (1.5.2 y 1.2.5); posible RAM que no se libera", "nota": "Usuario 26-11: lo quiere optimizar ya. Sospecha que la RAM no se vacía al cambiar de dimensión. 26-11: medido en xemu EN EL SERVER: Nether 65-67 fps (superficie 42-48), pero al entrar bajan los KB libres de 17,9 a 13,6 MB y las texturas de 2,7 a 4,7 MB; al volver (morir y reaparecer) siguen 13,1 MB libres y 4,7 MB de texturas = no se libera. El usuario dice que el lag es en SU MUNDO de un jugador (no en server): lo mide él en la consola con el log de red escuchando (xbox-spike\netlog.txt). 26-11 con el log de la consola (mundo propio): el lag NO es estar en el Nether (55-60 fps dentro); son 2 PARONES de ~8 s al CAMBIAR de dimensión (entrar por el portal en 1006,1141 y volver al morir en 120,147): antes de cada uno, decenas de «slow chunk save» de 80-146 ms SOLO armando el NBT (nbt=..., compress=0), ~80 chunks = 8 s. La memoria libre baja de ~24 MB a ~11 MB en la partida. Puestos medidores por partes en el guardado (sections/entities/tiles/ticks + freeKB) en las dos versiones; falta que el usuario cruce un portal y leer el log. En la consola desde 26-11 ~12:40 (1.5.2 y 1.2.5 normal+exp): PROBAR.", "ref": "", "orden": -3, "id": "nether-lag-ram"}, {"version": "ambas", "estado": "por_probar", "area": "Gráficos", "nombre": "Niebla del Nether", "nota": "agy midió las dos versiones en el Nether y salen idénticas (mismo código, mismos valores). Si en la consola se ven distintas, mirar Niebla, Distancia e Inicio de niebla en Vídeo de cada versión.", "ref": "88/90", "orden": 10, "estado_125": "probado", "estado_152": "probado", "id": "niebla-nether"}, {"version": "1.5.2", "estado": "probar", "area": "Mods y texturas", "nombre": "NoFall 'Cubo de agua' y módulo Agua más rápido (ideas de SalHack)", "nota": "26-11 noche. NoFall: nueva opción Cubo de agua (Back+X → NoFall → opción). Lleva un cubo de agua en la barra rápida; al caer de alto lo vacía antes del suelo y lo recoge. Para el server que aún hace daño con el modo Paquete. Módulo Agua: sin empuje de corriente y nado el doble de rápido. PROBAR en el server: saltar de 10+ bloques con el cubo; nadar contra un río con Agua.", "ref": "134", "orden": 3, "id": "nofall-cubo-agua"}, {"version": "ambas", "estado": "probado", "area": "Opciones", "nombre": "Mismas opciones en las dos versiones", "nota": "Avanzado en 1.2.5; Pocket, Hielo y Zona segura en la página 1.", "ref": "88", "orden": 11, "id": "opciones-iguales"}, {"version": "ambas", "estado": "por_probar", "area": "Texturas", "nombre": "Pack de texturas LCE: partículas del cofre de madera y fuego/portal/agua/lava bien", "nota": "1.2.5: todo bien, también la lava (arreglada fdd2911). En 1.5.2 falta probar. Usuario 26-11 (1.5.2): bien.", "ref": "90", "orden": 14, "estado_125": "probado", "estado_152": "probado", "id": "pack-lce"}, {"version": "ambas", "estado": "falta", "area": "Mods y texturas", "nombre": "Packs de la 3DS (Mario, Cartoon, Festive, Natural, Plastic, Steampunk) y pack Moderno 1.14/1.20", "nota": "Encargo 123, de mc3ds-modern (archivado). IP del SMP 3DS/Java 1.12: solo en su Discord (discord.gg/dFTQhUXbuS).", "ref": "123", "orden": 33, "id": "packs-3ds"}, {"version": "ambas", "estado": "aparcado", "area": "Mods y texturas", "nombre": "Descargar packs de texturas desde la consola (el PC hace de servidor de packs por la red de casa)", "nota": "Ya no hace falta: la consola descarga directa de Modrinth por HTTPS (informe 116).", "ref": "109", "orden": 24, "id": "packs-desde-consola"}, {"version": "ambas", "estado": "por_probar", "area": "HUD", "nombre": "Personaje animado arriba a la izquierda al agacharse, correr o volar (como la LCE)", "nota": "Hecho por Claude (1.2.5 474730f, 1.5.2 2a668af). La sombra oscurecía la barra en la oscuridad/volando: arreglado (se dibuja solo el modelo). Sin opción en menús todavía.", "ref": "Claude", "orden": 6, "estado_152": "probado", "estado_125": "probado", "id": "personaje-hud"}, {"version": "1.5.2", "estado": "por_probar", "area": "Criaturas", "nombre": "Pigman bebé: la espada flota a tamaño de adulto y la caja de golpes está mal", "nota": "Usuario 26-11. Revisar escala del objeto en la mano para hijos y la caja (¿mismo fallo setSize sin setPosition que el chocobo?). ARREGLO 1.5.2: RenderBiped reduce a la mitad y baja el objeto de la mano si el modelo es de cría (como Java 1.5.2); zombi/pigman bebé con caja 0,3x0,9 (se rehace con setPosition, también si el aviso de cría llega del server). En la consola desde 26-11 ~12:40 (1.5.2 y 1.2.5 normal+exp): PROBAR.", "ref": "", "orden": 1, "id": "pigman-bebe-espada"}, {"version": "ambas", "estado": "por_probar", "area": "Opciones", "nombre": "Optimizaciones Pocket", "nota": "Apagada por defecto; mirar si sube fps al activarla.", "ref": "87/88", "orden": 7, "estado_125": "probado", "estado_152": "probado", "id": "pocket"}, {"version": "1.5.2", "estado": "probar", "area": "Plataformas", "nombre": "PS2: 1.5.2 actual compilada y arrancando en PCSX2", "nota": "26-11 noche: ELF 7,67 MB + assets.pak 216 MB (sonidos PS2 del pak viejo + assets 1.5.2) en Desktop\\OptiCraft PS2 prueba. Arranca en PCSX2 (C:\\RetroXeo\\emulators\\pcsx2, -fastboot -elf); el usuario jugó 34 min. Falta probar en PS2 real y medir memoria. PLATAFORMAS-QUE-HACER.md.", "ref": "106", "orden": 5, "id": "ps2-152-pcsx2"}, {"version": "ambas", "estado": "probado", "area": "PS2", "nombre": "Auditoría PS2: qué hace falta para llevar todo lo nuevo a la PS2 (memoria, red, mando, dibujado)", "nota": "Hecha (informe 106): compila con 2 errores; 1.2.5 cabe con margen; 1.5.2 viable con recortes (ELF 7,5 MB). 9 adaptaciones antes de hardware real (minimapa, red skins, luces, texturas 16x, iconos PS2...). No viable: 720p, packs 32x+, autoguardado en Memory Card, split en mundos infinitos.", "ref": "106", "orden": 40, "id": "ps2-auditoria"}, {"version": "ambas", "estado": "probado", "area": "Redstone", "nombre": "Reloj de redstone", "nota": "Confirmado 19-11.", "ref": "", "orden": 21, "id": "redstone-reloj"}, {"version": "ambas", "estado": "por_probar", "area": "Mods y texturas", "nombre": "En el SMP la redstone sale con la textura de la verdura Gysahl (chocobo) aunque el mod esté apagado", "nota": "CAUSA (reproducido en xemu contra el Paper 1.12.2 local): el efecto de textura del chocobo pintaba la Gysahl y la paja en las casillas 180/181 del atlas de bloques 1.5.2, que el cable de redstone muestra (cruce = Gysahl, tramo = paja). Sin el efecto el cable sale bien. ARREGLO 1.5.2 (sin commit, wt-build-152): Gysahl -> casilla 250 (hueco sin uso), paja -> 109 (el fondo del pistón pasa a la 62, misma imagen); el efecto solo se registra con el mod encendido (y al encenderlo en marcha). Probado en xemu: cable, horno, pistón y tolva bien. La 1.2.5 no tenía el fallo (sus 180/181 no se leen). En la consola desde 26-11. 26-11: el usuario dice que en la 1.2.5 TAMBIÉN pasaba (mi lectura del código decía que no). Arreglo 1.2.5 (sin commit, wt-opti30): Gysahl -> 235, paja -> 236 (casillas de relleno sin uso del atlas 1.2.5) + solo con el mod encendido. Compilado 26-11, sin probar en xemu (el serv -11 ~11:45 (subido, md5 comprobado): PROBAR.", "ref": "121", "orden": 1, "id": "smp-alfombras-vallas"}, {"version": "ambas", "estado": "en_marcha", "area": "Red", "nombre": "En el SMP 1.12.2: pegado/empujado al saltar sobre losas (también en 1.5.2)", "nota": "Arreglado lo de losas de arriba/escaleras al revés en 1.2.5 (ef44334). Como también pasa en 1.5.2, el log ahora apunta cada corrección de posición del servidor («server teleport»): reproducir y mirar el log. Usuario 26-11 (1.2.5): losas BIEN. NUEVO: lo mismo con alfombras (se ven), vallas en esquina y nenúfares → tarea smp-alfombras-vallas.", "ref": "121", "orden": 1, "estado_125": "probado", "id": "smp-losas"}, {"version": "ambas", "estado": "por_probar", "area": "Interfaz", "nombre": "Frase «I love weed smoke everyday» en el menú", "nota": "Sale al azar en el menú principal.", "ref": "", "orden": 19, "id": "splash"}, {"version": "ambas", "estado": "por_probar", "area": "Mods y texturas", "nombre": "Packs de texturas: conversor fácil (arrastrar .zip) + packs clásicos + .zip directo en consola", "nota": "Conversor (carpeta texturas) + 8 packs en el lanzador; zip directo y anim juntados (1.5.2 950da98, 1.2.5 0e1a3b6). Falta subir.", "ref": "102", "orden": 23, "id": "texturas-conversor"}, {"version": "ambas", "estado": "por_probar", "area": "Interfaz", "nombre": "No hay dónde cambiar las texturas (entrada Texture Packs desaparecida)", "nota": "Ahora visible: «Packs de texturas» en Ayuda y opciones (Legacy) y en Opciones (Java), además de Start en el catálogo (64d3589 / 700fe8e). Usuario 26-11 (1.5.2): bien.", "ref": "111", "orden": 1, "estado_125": "probado", "estado_152": "probado", "id": "texturas-menu-perdido"}, {"version": "ambas", "estado": "falta", "area": "Mods y texturas", "nombre": "Con un pack de texturas se gastan ~3 MB más de RAM", "nota": "Normal si el pack es 32x (bloques y objetos 4 veces más grandes). Si pasa con 16x, medir con el log al cambiar de pack.", "ref": "", "orden": 8, "id": "texturas-ra  en el inventario, poción con blaze, tolva. Falta: renombrar en yunque y elegir efecto del faro (mensajes MC|ItemName/MC|Beacon sin traducir), aldeanos. 26-11 noche: el cliente no abría tipos 6-9: añadidos; aldeanos, yunque (renombrar) y faro (efecto) por MC|...; lapis encadenado tras confirmación; spawners con su mob.", "ref": "131", "orden": -1, "id": "tolva-server-152"}, {"version": "ambas", "estado": "probado", "area": "Web", "nombre": "Web: capturas en cuadrícula + visor, fondo por zonas (cueva/Nether/End), barras portal del End", "nota": "Publicado 24-11 en gh-pages. La sección 'Instalar desde el celular' va oculta (el usuario no quiere celular).", "ref": "128", "orden": 99, "id": "web-capturas-fondo"}, {"version": "ambas", "estado": "probado", "area": "Interfaz", "nombre": "Zona segura del HUD (720p)", "nota": "«Perfecto». 4 % por defecto.", "ref": "88", "orden": 9, "id": "zona-segura"}], "meta": {"actualizado": "26-11-2026 12:40", "agy": "1 solo agy (decisión del usuario): encargo 113 chocobos · Claude hace el resto · subagente: Modrinth (116)", "nota": "EN LA CONSOLA (26-11 ~12:40): 1.2.5 y 1.5.2 normal+exp con: cursor encima en el inventario (1.5.2), pigman bebé, medidores de guardado de chunks (Nether), log de la caja del chocobo, caché de iconos Modrinth, alfombras/vallas/nenúfares del SMP, redstone, ESP. SIN COMMIT (wt-build-152 / wt-opti30). agy sin cuota hasta ~03-12 (bot de minería a medias en wt-agy-152)."}}</script>
<div class="wrap">
  <header>
    <div>
      <h1>OptiCraft <span>Xbox</span> · estado</h1>
      <p class="sub">Todo lo que está hecho, probado en la consola, en marcha o por hacer, en la 1.5.2 y la 1.2.5. Claude lo va actualizando (fichero local: buzon-xbox\ESTADO-OPTICRAFT.html).</p>
    </div>
    <div class="stamp" id="stamp">Cargando…</div>
  </header>

  <div class="note" id="note"></div>

  <section class="versions" id="versions" aria-label="Versiones"></section>

  <div class="filters" role="group" aria-label="Filtrar por estado">
    <label>Mostrar</label>
    <button class="chip" data-f="todo" aria-pressed="true">Todo</button>
    <button class="chip" data-f="pendiente" aria-pressed="false">Pendiente (probar, falla, en marcha, falta)</button>
    <button class="chip" data-f="probado" aria-pressed="false">Solo probado</button>
  </div>

  <section class="groups" id="groups" aria-live="polite">
    <div class="empty">Cargando la lista de tareas…</div>
  </section>
</div>

<script>
const ESTADOS = [
  ["fallo","Falla"],["en_marcha","En marcha"],["por_probar","Por probar en la consola"],
  ["falta","Falta crear"],["aparcado","Aparcado"],["probado","Probado en la consola"]
];
const NOMBRE = Object.fromEntries(ESTADOS);
let tareas = [], meta = null, verSel = "1.5.2", filtro = "todo";

function esDe(t, v){ return t.version === v || t.version === "ambas"; }
function est(t, v){ return t["estado_" + v.replace(/\./g, "")] || t.estado; }
try { const g = localStorage.getItem("verSel"); if (g === "1.2.5" || g === "1.5.2") verSel = g; } catch (e) {}

function renderVersiones(){
  const box = document.getElementById("versions");
  box.textContent = "";
  for (const v of ["1.5.2","1.2.5"]) {
    const ts = tareas.filter(t => esDe(t, v));
    const cuenta = {}; ESTADOS.forEach(([k]) => cuenta[k] = 0);
    ts.forEach(t => { const e = est(t, v); cuenta[e] = (cuenta[e]||0) + 1; });
    const total = ts.length || 1;
    const pct = Math.round(100 * cuenta.probado / total);
    const b = document.createElement("button");
    b.className = "ver"; b.type = "button"; b.setAttribute("aria-pressed", String(v === verSel));
    b.onclick = () => { verSel = v; try { localStorage.setItem("verSel", v); } catch (e) {} render(); };
    const h = document.createElement("h2");
    h.innerHTML = `Java ${v} <small>${v === "1.5.2" ? "port152-erluza" : "opti30-erluza"}</small>`;
    const p = document.createElement("div"); p.className = "pct";
    p.innerHTML = `${pct}%<em>probado (${cuenta.probado} de ${ts.length})</em>`;
    const bar = document.createElement("div"); bar.className = "bar";
    const leg = document.createElement("div"); leg.className = "legend";
    for (const [k, nombre] of [["probado"],["por_probar"],["en_marcha"],["fallo"],["aparcado"],["falta"]].map(x=>[x[0],NOMBRE[x[0]]])) {
      if (!cuenta[k]) continue;
      const i = document.createElement("i"); i.dataset.s = k; i.style.background = "var(--c)";
      i.style.width = (100 * cuenta[k] / total) + "%"; i.title = `${nombre}: ${cuenta[k]}`; bar.appendChild(i);
      const s = document.createElement("span"); s.dataset.s = k; s.textContent = `${nombre} ${cuenta[k]}`; leg.appendChild(s);
    }
    b.append(h, p, bar, leg); box.appendChild(b);
  }
}

function renderLista(){
  const box = document.getElementById("groups");
  box.textContent = "";
  let ts = tareas.filter(t => esDe(t, verSel));
  if (filtro === "probado") ts = ts.filter(t => est(t, verSel) === "probado");
  if (filtro === "pendiente") ts = ts.filter(t => est(t, verSel) !== "probado");
  if (!tareas.length) { box.innerHTML = '<div class="empty">Todavía no hay tareas guardadas. Claude las añade desde el chat.</div>'; return; }
  const tit = document.createElement("h2"); tit.className = "vertit"; tit.textContent = "Lista de Java " + verSel; box.appendChild(tit);
  if (!ts.length) { box.insertAdjacentHTML("beforeend", '<div class="empty">Nada en este filtro.</div>'); return; }
  for (const [k, nombre] of ESTADOS) {
    const g = ts.filter(t => est(t, verSel) === k).sort((a,b) => (a.orden||0)-(b.orden||0) || a.nombre.localeCompare(b.nombre));
    if (!g.length) continue;
    const sec = document.createElement("div"); sec.className = "group"; sec.dataset.s = k;
    const h = document.createElement("h3");
    h.innerHTML = `<span class="dot"></span>`; h.append(nombre);
    const n = document.createElement("span"); n.className = "n"; n.textContent = `${g.length}`; h.appendChild(n);
    const list = document.createElement("div"); list.className = "list";
    for (const t of g) {
      const r = document.createElement("div"); r.className = "row"; r.dataset.s = est(t, verSel);
      const st = document.createElement("span"); st.className = "stripe";
      const m = document.createElement("div"); m.className = "main";
      const nm = document.createElement("div"); nm.className = "name"; nm.textContent = t.nombre;
      m.appendChild(nm);
      if (t.nota) { const d = document.createElement("div"); d.className = "desc"; d.textContent = t.nota; m.appendChild(d); }
      const meta = document.createElement("div"); meta.className = "meta";
      if (t.version === "ambas") { const v = document.createElement("span"); v.className = "tag v"; v.textContent = "1.2.5 + 1.5.2"; meta.appendChild(v); }
      if (t.area) { const a = document.createElement("span"); a.className = "tag"; a.textContent = t.area; meta.appendChild(a); }
      if (t.ref) { const a = document.createElement("span"); a.className = "tag"; a.textContent = t.ref; meta.appendChild(a); }
      r.append(st, m, meta); list.appendChild(r);
    }
    sec.append(h, list); box.appendChild(sec);
  }
}

function renderMeta(){
  const s = document.getElementById("stamp"), n = document.getElementById("note");
  if (meta) {
    s.innerHTML = `Actualizado <b></b><br>`;
    s.querySelector("b").textContent = meta.actualizado || "—";
    if (meta.agy) s.append("agy: " + meta.agy);
    n.textContent = meta.nota || ""; n.classList.toggle("show", !!meta.nota);
  }
}

function render(){ renderVersiones(); renderLista(); renderMeta(); }
