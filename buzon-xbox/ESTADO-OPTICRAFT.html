<head>

<title>Estado OptiCraft Xbox</title>

<style>
body{margin:0}
/* Layout: a console "dashboard" — version switch on top, one progress strip per version, then the task list grouped by state. */
:root{
  --bg:#f3f5f1; --panel:#ffffff; --ink:#18201a; --muted:#5d685f; --line:#dde3da;
  --accent:#0f7b2e; --accent-soft:#e2f1e5;
  --ok:#1b8a3c; --test:#2f6fd6; --wip:#c78400; --todo:#8a948c; --bad:#c7392f; --park:#a99b7a;
  --ok-bg:#e3f3e7; --test-bg:#e4ecfb; --wip-bg:#fbf0d9; --todo-bg:#eceeea; --bad-bg:#fbe4e2; --park-bg:#f1ecdf;
  --display:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;
  --body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101511; --panel:#171e18; --ink:#e7ede6; --muted:#9aa79c; --line:#2a342c;
  --accent:#4cc46a; --accent-soft:#1c2e20;
  --ok:#4cc46a; --test:#6e9ff0; --wip:#e2a93a; --todo:#7d887f; --bad:#ec6a5f; --park:#b9a983;
  --ok-bg:#1a2f1f; --test-bg:#1a2438; --wip-bg:#33280f; --todo-bg:#202721; --bad-bg:#3a1c1a; --park-bg:#2c271b;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101511; --panel:#171e18; --ink:#e7ede6; --muted:#9aa79c; --line:#2a342c;
  --accent:#4cc46a; --accent-soft:#1c2e20;
  --ok:#4cc46a; --test:#6e9ff0; --wip:#e2a93a; --todo:#7d887f; --bad:#ec6a5f; --park:#b9a983;
  --ok-bg:#1a2f1f; --test-bg:#1a2438; --wip-bg:#33280f; --todo-bg:#202721; --bad-bg:#3a1c1a; --park-bg:#2c271b;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,4vw,36px);line-height:1.1;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:4px 0 0;max-width:62ch}
.stamp{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:right}
.stamp b{color:var(--ink);font-weight:500}
.note{background:var(--accent-soft);border-radius:10px;padding:12px 16px;font-size:14.5px;display:none}
.note.show{display:block}
.versions{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.ver{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.ver[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ver:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ver h2{font-family:var(--display);font-size:20px;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ver h2 small{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--muted)}
.pct{font-family:var(--display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.pct em{font-style:normal;font-size:14px;color:var(--muted);font-family:var(--body);font-weight:500;margin-left:6px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--todo-bg)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--c);vertical-align:0}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters label{font-size:13px;color:var(--muted);margin-right:4px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 12px;font:500 13px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.groups{display:flex;flex-direction:column;gap:22px}
.group h3{font-family:var(--display);font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:8px;letter-spacing:.02em;text-transform:uppercase}
.group h3 .dot{width:10px;height:10px;border-radius:3px;background:var(--c)}
.group h3 .n{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-transform:none}
.list{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:11px 16px;border-top:1px solid var(--line);align-items:start}
.row:first-child{border-top:0}
.row .stripe{width:4px;align-self:stretch;border-radius:2px;background:var(--c)}
.row .main{min-width:0}
.row .name{font-weight:600}
.row .desc{color:var(--muted);font-size:13.5px;margin-top:1px}
.row .meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-family:var(--mono);font-size:11.5px;padding:2px 7px;border-radius:5px;background:var(--todo-bg);color:var(--muted);white-space:nowrap}
.tag.v{background:var(--accent-soft);color:var(--accent)}
.empty{padding:28px 20px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:12px}
[data-s="probado"]{--c:var(--ok)} [data-s="por_probar"]{--c:var(--test)} [data-s="en_marcha"]{--c:var(--wip)}
[data-s="falta"]{--c:var(--todo)} [data-s="fallo"]{--c:var(--bad)} [data-s="aparcado"]{--c:var(--park)}
@media (max-width:560px){.row{grid-template-columns:auto 1fr}.row .meta{grid-column:2;justify-content:flex-start}.stamp{text-align:left}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}
.vertit{font-size:1.4rem;margin:0 0 12px}
</style>

</head>

": "ambas", "estado": "por_probar", "area": "Arreglos", "nombre": "Borde del mundo limitado sin quedarse pegado", "nota": "1.2.5 probado: Legacy 864x864 (X/Z de -432 a 431) y Antiguo 256x256 (de -128 a 127), bordes y esquinas sin crash.", "ref": "87", "orden": 4, "estado_125": "probado", "id": "erluza-borde"}, {"version": "ambas", "estado": "por_probar", "area": "Arreglos", "nombre": "Cofres y hornos se guardan al descargar el chunk", "nota": "Cambiar un cofre, alejarse y volver.", "ref": "87", "orden": 3, "estado_125": "probado", "id": "erluza-chunks"}, {"version": "ambas", "estado": "por_probar", "area": "Arreglos", "nombre": "Volver del End al mundo normal", "nota": "Antes caías enterrado en 100,50,0; ahora en tu punto de inicio. Entrada centrada en la obsidiana.", "ref": "87", "orden": 0, "estado_125": "probado", "estado_152": "probado", "id": "erluza-end"}, {"version": "ambas", "estado": "probado", "area": "Rendimiento", "nombre": "Pistones en cadena", "nota": "Confirmado 19-11.", "ref": "87", "orden": 2, "id": "erluza-pistones"}, {"version": "ambas", "estado": "probado", "area": "Rendimiento", "nombre": "TNT en cadena sin tirones", "nota": "Confirmado 19-11.", "ref": "87", "orden": 1, "id": "erluza-tnt"}, {"version": "ambas", "estado": "por_probar", "area": "Rendimiento", "nombre": "Vagonetas y explosiones más ligeras; no colgarse sin memoria", "nota": "Encargo 91 (también en 1.2.5): colisiones entre vagonetas, explosiones de TNT/creeper y recuperación si se acaba la memoria. Claude añadió que un chunk sin guardar no se descarga aunque falte memoria.", "ref": "91", "orden": 3, "estado_152": "probado", "id": "explosiones-memoria"}, {"version": "ambas", "estado": "por_probar", "area": "Forks", "nombre": "Traer lo útil del fork ramide1 (arco, cambio de dimensión, multijugador)", "nota": "Hecho y probado en mundo (1.2.5 f1bf66a, 1.5.2 a2ec7d1): arco como Java, listas de dibujo, multijugador, opción «Pistas en pantalla». OJO: al volver sobre chunks guardados la RAM rmación.", "ref": "90", "orden": 15, "estado_125": "probado", "estado_152": "probado", "id": "logros-cursor"}, {"version": "ambas", "estado": "probado", "area": "Mando", "nombre": "Mantener A coge de 1 en 1", "nota": "Confirmado en las dos.", "ref": "85", "orden": 17, "id": "mantener-a"}, {"version": "ambas", "estado": "por_probar", "area": "Rendimiento", "nombre": "Mobs tapados: solo se ocultan 6+ bloques por debajo", "nota": "La vaca detrás de una colina ya no desaparece. Documentado en docs/XBOX_PORT.md (encargo 90).", "ref": "87", "orden": 5, "estado_125": "probado", "estado_152": "probado", "id": "mobs-ocultos"}, {"version": "ambas", "estado": "en_marcha", "area": "Mods y texturas", "nombre": "Mod ChocoCraft (chocobos)", "nota": "agy-2, encargo 101.", "ref": "101", "orden": 22, "id": "mods-chocobos"}, {"version": "ambas", "estado": "en_marcha", "area": "Mods y texturas", "nombre": "Mod Herobrine clásico (altar)", "nota": "agy-2, encargo 101.", "ref": "101", "orden": 21, "id": "mods-herobrine"}, {"version": "ambas", "estado": "en_marcha", "area": "Mods y texturas", "nombre": "Mods: catálogo con instalar de un clic, minimapa (Rei + Xaero), X-Ray, Village Locator, luces dinámicas (de erluza)", "nota": "agy-2, encargo 101 (wt-152-mods / wt-125-mods).", "ref": "101", "orden": 20, "id": "mods-minimapa"}, {"version": "ambas", "estado": "por_probar", "area": "Gráficos", "nombre": "Niebla del Nether", "nota": "agy midió las dos versiones en el Nether y salen idénticas (mismo código, mismos valores). Si en la consola se ven distintas, mirar Niebla, Distancia e Inicio de niebla en Vídeo de cada versión.", "ref": "88/90", "orden": 10, "estado_125": "probado", "estado_152": "probado", "id": "niebla-nether"}, {"version": "ambas", "estado": "probado", "area": "Opciones", "nombre": "Mismas opciones en las dos versiones", "nota": "Avanzado en 1.2.5; Pocket, Hielo y Zona segura en la página 1.", "ref": "88", "orden": 11, "id": "opciones-iguales"}, {"version": "ambas", "estado": "por_probar", "area": "Texturas", "nombre": "Pack de texturas LCE: partículas del cofre de madera y fuego/portal/agua/lava bien", "nota": "1.2.5: todo bien, también la lava (arreglada fdd2911). En 1.5.2 falta probar.", "ref": "90", "orden": 14, "estado_125": "probado", "id": "pack-lce"}, {"version": "ambas", "estado": "por_probar", "area": "HUD", "nombre": "Personaje animado arriba a la izquierda al agacharse, correr o volar (como la LCE)", "nota": "Hecho por Claude (1.2.5 474730f, 1.5.2 2a668af). La sombra oscurecía la barra en la oscuridad/volando: arreglado (se dibuja solo el modelo). Sin opción en menús todavía.", "ref": "Claude", "orden": 6, "estado_152": "probado", "id": "personaje-hud"}, {"version": "ambas", "estado": "por_probar", "area": "Opciones", "nombre": "Optimizaciones Pocket", "nota": "Apagada por defecto; mirar si sube fps al activarla.", "ref": "87/88", "orden": 7, "estado_125": "probado", "estado_152": "probado", "id": "pocket"}, {"version": "ambas", "estado": "probado", "area": "Redstone", "nombre": "Reloj de redstone", "nota": "Confirmado 19-11.", "ref": "", "orden": 21, "id": "redstone-reloj"}, {"version": "ambas", "estado": "falta", "area": "Skins", "nombre": "Buscar y descargar skins por usuario desde la consola (rueda: Skins personalizadas)", "nota": "Encargo 103 para agy-1 tras el 99. Fuente por HTTP: minotar.net/skin/<usuario>.", "ref": "103", "orden": 26, "id": "skins-online"}, {"version": "ambas", "estado": "probado", "area": "Skins", "nombre": "Skins de Halo, Mass Effect y Skyrim", "nota": "«Perfectas».", "ref": "85", "orden": 18, "id": "skins-packs"}, {"version": "ambas", "estado": "por_probar", "area": "Interfaz", "nombre": "Frase «I love weed smoke everyday» en el menú", "nota": "Sale al azar en el menú principal.", "ref": "", "orden": 19, "id": "splash"}, {"version": "ambas", "estado": "en_marcha", "area": "Mods y texturas", "nombre": "Packs de texturas: conversor fácil (arrastrar .zip) + packs clásicos + .zip directo en consola", "nota": "Conversor y 8 packs listos (en el lanzador, falta subir). Zip directo + animaciones de packs: hecho (1.5.2 port152-tex 87a3ec7, 1.2.5 opti30-tex 7c01458), compila, sin probar; avisa si el pack es 64x o formato 1.5. Falta juntarlo.", "ref": "102", "orden": 23, "id": "texturas-conversor"}, {"version": "ambas", "estado": "probado", "area": "Interfaz", "nombre": "Zona segura del HUD (720p)", "nota": "«Perfecto». 4 % por defecto.", "ref": "88", "orden": 9, "id": "zona-segura"}], "meta": {"actualizado": "22-11-2026", "agy": "agy-1: encargo 99 · agy-2: encargo 101 (mods) · 2 subagentes: encantar/mapas y texturas", "nota": "PENDIENTE subir a la consola: 1.2.5 f1bf66a y 1.5.2 a2ec7d1 (ya en el lanzador). Vigilar RAM al volver a zonas cargadas. Propuesta portal del End (4 capas por pasada) sin decidir."}}</script>
<div class="wrap">
  <header>
    <div>
      <h1>OptiCraft <span>Xbox</span> · estado</h1>
      <p class="sub">Todo lo que está hecho, probado en la consola, en marcha o por hacer, en la 1.5.2 y la 1.2.5. Claude lo va actualizando (fichero local: buzon-xbox\ESTADO-OPTICRAFT.html).</p>
    </div>
    <div class="stamp" id="stamp">Cargando…</div>
  </header>

  <div class="note" id="note"></div>

  <section class="versions" id="versions" aria-label="Versiones"></section>

  <div class="filters" role="group" aria-label="Filtrar por estado">
    <label>Mostrar</label>
    <button class="chip" data-f="todo" aria-pressed="true">Todo</button>
    <button class="chip" data-f="pendiente" aria-pressed="false">Pendiente (probar, falla, en marcha, falta)</button>
    <button class="chip" data-f="probado" aria-pressed="false">Solo probado</button>
  </div>

  <section class="groups" id="groups" aria-live="polite">
    <div class="empty">Cargando la lista de tareas…</div>
  </section>
</div>

<script>
const ESTADOS = [
  ["fallo","Falla"],["en_marcha","En marcha"],["por_probar","Por probar en la consola"],
  ["falta","Falta crear"],["aparcado","Aparcado"],["probado","Probado en la consola"]
];
const NOMBRE = Object.fromEntries(ESTADOS);
let tareas = [], meta = null, verSel = "1.5.2", filtro = "todo";

function esDe(t, v){ return t.version === v || t.version === "ambas"; }
function est(t, v){ return t["estado_" + v.replace(/\./g, "")] || t.estado; }
try { const g = localStorage.getItem("verSel"); if (g === "1.2.5" || g === "1.5.2") verSel = g; } catch (e) {}

function renderVersiones(){
  const box = document.getElementById("versions");
  box.textContent = "";
  for (const v of ["1.5.2","1.2.5"]) {
    const ts = tareas.filter(t => esDe(t, v));
    const cuenta = {}; ESTADOS.forEach(([k]) => cuenta[k] = 0);
    ts.forEach(t => { const e = est(t, v); cuenta[e] = (cuenta[e]||0) + 1; });
    const total = ts.length || 1;
    const pct = Math.round(100 * cuenta.probado / total);
    const b = document.createElement("button");
    b.className = "ver"; b.type = "button"; b.setAttribute("aria-pressed", String(v === verSel));
    b.onclick = () => { verSel = v; try { localStorage.setItem("verSel", v); } catch (e) {} render(); };
    const h = document.createElement("h2");
    h.innerHTML = `Java ${v} <small>${v === "1.5.2" ? "port152-erluza" : "opti30-erluza"}</small>`;
    const p = document.createElement("div"); p.className = "pct";
    p.innerHTML = `${pct}%<em>probado (${cuenta.probado} de ${ts.length})</em>`;
    const bar = document.createElement("div"); bar.className = "bar";
    const leg = document.createElement("div"); leg.className = "legend";
    for (const [k, nombre] of [["probado"],["por_probar"],["en_marcha"],["fallo"],["aparcado"],["falta"]].map(x=>[x[0],NOMBRE[x[0]]])) {
      if (!cuenta[k]) continue;
      const i = document.createElement("i"); i.dataset.s = k; i.style.background = "var(--c)";
      i.style.width = (100 * cuenta[k] / total) + "%"; i.title = `${nombre}: ${cuenta[k]}`; bar.appendChild(i);
      const s = document.createElement("span"); s.dataset.s = k; s.textContent = `${nombre} ${cuenta[k]}`; leg.appendChild(s);
    }
    b.append(h, p, bar, leg); box.appendChild(b);
  }
}

function renderLista(){
  const box = document.getElementById("groups");
  box.textContent = "";
  let ts = tareas.filter(t => esDe(t, verSel));
  if (filtro === "probado") ts = ts.filter(t => est(t, verSel) === "probado");
  if (filtro === "pendiente") ts = ts.filter(t => est(t, verSel) !== "probado");
  if (!tareas.length) { box.innerHTML = '<div class="empty">Todavía no hay tareas guardadas. Claude las añade desde el chat.</div>'; return; }
  const tit = document.createElement("h2"); tit.className = "vertit"; tit.textContent = "Lista de Java " + verSel; box.appendChild(tit);
  if (!ts.length) { box.insertAdjacentHTML("beforeend", '<div class="empty">Nada en este filtro.</div>'); return; }
  for (const [k, nombre] of ESTADOS) {
    const g = ts.filter(t => est(t, verSel) === k).sort((a,b) => (a.orden||0)-(b.orden||0) || a.nombre.localeCompare(b.nombre));
    if (!g.length) continue;
    const sec = document.createElement("div"); sec.className = "group"; sec.dataset.s = k;
    const h = document.createElement("h3");
    h.innerHTML = `<span class="dot"></span>`; h.append(nombre);
    const n = document.createElement("span"); n.className = "n"; n.textContent = `${g.length}`; h.appendChild(n);
    const list = document.createElement("div"); list.className = "list";
    for (const t of g) {
      const r = document.createElement("div"); r.className = "row"; r.dataset.s = est(t, verSel);
      const st = document.createElement("span"); st.className = "stripe";
      const m = document.createElement("div"); m.className = "main";
      const nm = document.createElement("div"); nm.className = "name"; nm.textContent = t.nombre;
      m.appendChild(nm);
      if (t.nota) { const d = document.createElement("div"); d.className = "desc"; d.textContent = t.nota; m.appendChild(d); }
      const meta = document.createElement("div"); meta.className = "meta";
      if (t.version === "ambas") { const v = document.createElement("span"); v.className = "tag v"; v.textContent = "1.2.5 + 1.5.2"; meta.appendChild(v); }
      if (t.area) { const a = document.createElement("span"); a.className = "tag"; a.textContent = t.area; meta.appendChild(a); }
      if (t.ref) { const a = document.createElement("span"); a.className = "tag"; a.textContent = t.ref; meta.appendChild(a); }
      r.append(st, m, meta); list.appendChild(r);
    }
    sec.append(h, list); box.appendChild(sec);
  }
}

function renderMeta(){
  const s = document.getElementById("stamp"), n = document.getElementById("note");
  if (meta) {
    s.innerHTML = `Actualizado <b></b><br>`;
    s.querySelector("b").textContent = meta.actualizado || "—";
    if (meta.agy) s.append("agy: " + meta.agy);
    n.textContent = meta.nota || ""; n.classList.toggle("show", !!meta.nota);
  }
}

function render(){ renderVersiones(); renderLista(); renderMeta(); }

document.querySelectorAll(".chip").forEach(c => c.onclick = () => {
  filtro = c.dataset.f;
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", String(x === c)));
  renderLista();
});

render();
